
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uma surpresa 🐈</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #video {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 56.25vw;
      max-width: 177.78vh;
      max-height: 100vh;
      aspect-ratio: 16 / 9;
      transform: translate(-50%, -50%);
      border: none;
    }

    #entrar {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #000;
      color: #fff;
      text-align: center;
      padding: 24px;
    }

    button {
      background: #fff;
      color: #000;
      border: none;
      border-radius: 12px;
      padding: 17px 25px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    p {
      color: #bbb;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <iframe
    id="video"
    title="Vídeo de gatos"
    allow="autoplay; encrypted-media; picture-in-picture"
    referrerpolicy="strict-origin-when-cross-origin"
    src="about:blank">
  </iframe>

  <div id="entrar">
    <h2>🐈 Preparado para a surpresa?</h2>
    <button id="botao">Tocar para continuar</button>
    <p>🔊 Aumente o volume!</p>
  </div>

  <script>
    const video = document.getElementById("video");
    const entrar = document.getElementById("entrar");
    const botao = document.getElementById("botao");

    botao.addEventListener("click", () => {
      video.src =
        "https://www.youtube.com/embed/hvL1339luv0" +
        "?autoplay=1&mute=0&controls=1" +
        "&playsinline=1&rel=0";

      entrar.remove();
    });
  </script>
</body>
</html>
